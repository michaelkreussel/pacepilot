<aside class="mt-3 rounded-xl border border-primary/25 bg-primary-subtle/60 p-3" data-proposal-card data-workout-id="{{ card.workout_id }}">
  <div class="flex flex-wrap items-start justify-between gap-2">
    <div class="min-w-0">
      <p class="text-[0.625rem] font-semibold uppercase tracking-[0.14em] text-primary-emphasis">Trainingsvorschlag</p>
      <h3 class="mt-1 truncate font-display text-base font-semibold text-foreground">{{ card.name }}</h3>
    </div>
    <span class="rounded-full bg-surface px-2 py-1 text-[0.625rem] font-semibold text-primary-emphasis">{{ card.status_label }}</span>
  </div>
  <div class="mt-2 flex flex-wrap gap-1.5 text-[0.6875rem] font-medium text-foreground">
    {% if card.suggested_for %}<span class="rounded-md bg-surface px-2 py-1">{{ card.suggested_for.strftime('%d.%m.%Y') }}</span>{% endif %}
    <span class="rounded-md bg-surface px-2 py-1">{{ card.duration_minutes }} Minuten</span>
    <span class="rounded-md bg-surface px-2 py-1">{{ card.target_label }}</span>
  </div>
  <p class="mt-2 text-xs leading-5 text-muted-foreground">{{ card.status_description }}</p>
  <a class="mt-3 inline-flex min-h-9 items-center justify-center rounded-lg bg-primary px-3 py-2 text-xs font-semibold text-primary-foreground transition hover:bg-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" href="/workouts/{{ card.workout_id }}">Vorschlag prüfen</a>
</aside>
