<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
  <label class="block min-w-0 text-xs font-semibold text-foreground">Schritttyp<select class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" x-model="step.step_type"><option value="warmup">Aufwärmen</option><option value="interval">Belastung</option><option value="recovery">Erholung</option><option value="cooldown">Auslaufen</option></select></label>
  <label class="block min-w-0 text-xs font-semibold text-foreground">Bemessung<select class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" :value="step.end.type" @change="setEndType(step, $event.target.value)"><option value="time">Zeit</option><option value="distance">Distanz</option></select></label>
  <template x-if="step.end.type === 'time'"><label class="block min-w-0 text-xs font-semibold text-foreground">Minuten<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="number" min="0.1" step="0.1" required :value="minutes(step)" @input="step.end.seconds = Number($event.target.value) * 60"></label></template>
  <template x-if="step.end.type === 'distance'"><label class="block min-w-0 text-xs font-semibold text-foreground">Meter<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="number" min="1" step="1" required x-model.number="step.end.meters"></label></template>
  <label class="block min-w-0 text-xs font-semibold text-foreground">Ziel<select class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" :value="step.target.type" @change="setTargetType(step, $event.target.value)"><option value="none">Kein Ziel</option><option value="pace_range" :disabled="sport !== 'running'">Pace-Bereich</option><option value="heart_rate_range">Herzfrequenzbereich</option><option value="heart_rate_zone">Garmin HF-Zone</option></select></label>
  <template x-if="step.target.type === 'pace_range'"><div class="col-span-full grid grid-cols-1 gap-3 sm:grid-cols-2"><label class="block min-w-0 text-xs font-semibold text-foreground">Schnelle Grenze<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="text" inputmode="numeric" pattern="[0-9]+:[0-5][0-9]" required :value="formatPace(step.target.fastest_seconds_per_km)" @input="setPace(step.target, 'fastest_seconds_per_km', $event.target.value)" placeholder="3:55"></label><label class="block min-w-0 text-xs font-semibold text-foreground">Langsame Grenze<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="text" inputmode="numeric" pattern="[0-9]+:[0-5][0-9]" required :value="formatPace(step.target.slowest_seconds_per_km)" @input="setPace(step.target, 'slowest_seconds_per_km', $event.target.value)" placeholder="4:15"></label></div></template>
  <template x-if="step.target.type === 'heart_rate_range'"><div class="col-span-full grid grid-cols-1 gap-3 sm:grid-cols-2"><label class="block min-w-0 text-xs font-semibold text-foreground">Untere Grenze (bpm)<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="number" min="30" max="249" required x-model.number="step.target.lower_bpm"></label><label class="block min-w-0 text-xs font-semibold text-foreground">Obere Grenze (bpm)<input class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" type="number" min="31" max="250" required x-model.number="step.target.upper_bpm"></label></div></template>
  <template x-if="step.target.type === 'heart_rate_zone'"><label class="block min-w-0 text-xs font-semibold text-foreground">Garmin-Zone<select class="mt-1.5 block w-full rounded-md border border-input bg-surface px-3 py-2 text-sm text-foreground shadow-none outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-2 focus:ring-ring/20 disabled:cursor-not-allowed disabled:opacity-50" x-model.number="step.target.zone"><option value="1">Zone 1</option><option value="2">Zone 2</option><option value="3">Zone 3</option><option value="4">Zone 4</option><option value="5">Zone 5</option></select></label></template>
</div>
