services:
  pacepilot:
    build: .
    container_name: pacepilot
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GARMIN_TOKEN_DIR: /data/garmin-tokens
      GARMIN_OPERATION_STALE_MINUTES: ${GARMIN_OPERATION_STALE_MINUTES:-15}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      MUTATION_RATE_LIMIT_PER_MINUTE: ${MUTATION_RATE_LIMIT_PER_MINUTE:-120}
      COACH_RATE_LIMIT_PER_MINUTE: ${COACH_RATE_LIMIT_PER_MINUTE:-12}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      ACCOUNT_EXPORT_RATE_LIMIT_PER_MINUTE: ${ACCOUNT_EXPORT_RATE_LIMIT_PER_MINUTE:-2}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      COACH_WORKOUT_PROPOSALS_ENABLED: ${COACH_WORKOUT_PROPOSALS_ENABLED:-false}
      COACH_GARMIN_SYNC_ENABLED: ${COACH_GARMIN_SYNC_ENABLED:-false}
      COACH_DAILY_ADAPTATION_ENABLED: ${COACH_DAILY_ADAPTATION_ENABLED:-false}
      COACH_PLAN_GENERATION_ENABLED: ${COACH_PLAN_GENERATION_ENABLED:-false}
      COACH_PLANNER_HISTORY_GATES_ENABLED: ${COACH_PLANNER_HISTORY_GATES_ENABLED:-true}
      COACH_DEFERRED_QUALITY_TEMPLATES_ENABLED: ${COACH_DEFERRED_QUALITY_TEMPLATES_ENABLED:-false}
      COACH_ROLLOUT_USER_IDS: ${COACH_ROLLOUT_USER_IDS:-}
    restart: unless-stopped
