services:
  pacepilot:
    build: .
    container_name: pacepilot
    ports:
      - "8000:8000"
    volumes:
      - pacepilot-data:/data
    environment:
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
      GARMIN_TOKEN_DIR: /data/garmin-tokens
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    restart: unless-stopped

volumes:
  pacepilot-data:
