services:
  pacepilot:
    build: .
    container_name: pacepilot
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GARMIN_TOKEN_DIR: /data/garmin-tokens
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      COACH_WORKOUT_PROPOSALS_ENABLED: ${COACH_WORKOUT_PROPOSALS_ENABLED:-false}
      COACH_GARMIN_SYNC_ENABLED: ${COACH_GARMIN_SYNC_ENABLED:-false}
      COACH_DAILY_ADAPTATION_ENABLED: ${COACH_DAILY_ADAPTATION_ENABLED:-false}
      COACH_PLAN_GENERATION_ENABLED: ${COACH_PLAN_GENERATION_ENABLED:-false}
    restart: unless-stopped
