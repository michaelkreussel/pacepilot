[project]
name = "pacepilot"
version = "0.1.0"
description = "A small self-hosted Garmin training companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno[openai]>=2.8,<3",
    "alembic>=1.14,<2",
    "apscheduler>=3.11,<4",
    "authlib>=1.4,<2",
    "fastapi>=0.115,<1",
    "garminconnect[workout]>=0.3.7,<0.4",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "ty>=0.0.69",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
